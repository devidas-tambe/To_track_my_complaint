<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMC Super Admin Auth Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #1e2229; font-family: 'Segoe UI', sans-serif; }
        .card-admin { border-radius: 12px; background-color: #2b303c; border: 1px solid #3f4756; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .form-control-dark { background-color: #1c1f26; border: 1px solid #495469; color: #ffffff; }
        .form-control-dark:focus { background-color: #1c1f26; border-color: #ffc107; color: #ffffff; box-shadow: none; }
        label { color: #cbd5e1; font-weight: 500; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-5 col-lg-4">
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} text-center fw-medium shadow-sm mb-3" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <div class="card card-admin p-4">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock-fill text-warning display-5"></i>
                        <h4 class="text-white fw-bold mt-2 mb-0">NMC Super Admin</h4>
                        <p class="text-muted small mt-1">Control Operations Center</p>
                    </div>
                    
                    <form action="/admin/login" method="POST">
                        <div class="mb-3">
                            <label class="form-label small"><i class="bi bi-envelope text-warning me-1"></i> Admin Email</label>
                            <input type="email" name="email" class="form-control form-control-dark py-2" placeholder="devidas@gmail.com" required>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label small"><i class="bi bi-key text-warning me-1"></i> Secure Password</label>
                            <input type="password" name="password" class="form-control form-control-dark py-2" placeholder="••••••••" required>
                        </div>
                        
                        <button type="submit" class="btn btn-warning w-100 fw-bold py-2 text-dark shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Authorize & Enter
                        </button>
                    </form>
                    
                    <div class="text-center mt-4 pt-2 border-top border-secondary">
                        <a href="/" class="text-warning text-decoration-none small"><i class="bi bi-house-door"></i> Back to Public Home</a>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</div>

</body>
</html>
